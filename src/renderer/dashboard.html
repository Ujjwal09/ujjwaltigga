<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TimeGrid — Analytics</title>
<style>
  :root{
    --bg:#14151a;--card:#1c1e25;--line:rgba(255,255,255,0.07);
    --text:#e7e8ec;--muted:#8b8d98;--faint:#4a4c57;--accent:#5eead4;
    --font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;padding:28px 32px}
  h1{font-size:18px;font-weight:600;letter-spacing:.3px;margin-bottom:2px}
  .sub{color:var(--muted);font-size:12px;margin-bottom:22px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .kpi .v{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
  .kpi .v small{font-size:13px;color:var(--muted);font-weight:400}
  .kpi .l{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.3px;text-transform:uppercase}
  .kpi .accent{color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px}
  .card h2{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:16px;letter-spacing:.3px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  svg{width:100%;height:auto;display:block;overflow:visible}
  .bar{fill:var(--accent);opacity:.85}
  .bar.dim{opacity:.28}
  .axis{fill:var(--faint);font-size:9px}
  .empty{color:var(--faint);font-size:12px;text-align:center;padding:30px}
  /* heatmap */
  .hm{display:flex;gap:3px;flex-wrap:wrap}
  .hm .col{display:flex;flex-direction:column;gap:3px}
  .hm .cell{width:13px;height:13px;border-radius:3px;background:rgba(255,255,255,0.05)}
  .legend{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;margin-top:10px}
  .legend .cell{width:12px;height:12px;border-radius:3px}
  /* topic goals */
  .goal{margin-bottom:16px}
  .goal:last-child{margin-bottom:0}
  .goal .top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .goal .swatch{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
  .goal .name{font-size:13px;font-weight:600}
  .goal .hrs{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .goal .hrs b{color:var(--text)}
  .goal .tier{font-size:11px;color:var(--accent);margin-left:auto}
  .track{position:relative;height:8px;background:rgba(255,255,255,0.06);border-radius:5px;overflow:hidden}
  .track > i{display:block;height:100%;border-radius:5px}
  .ticks{position:relative;height:14px;margin-top:3px}
  .ticks span{position:absolute;transform:translateX(-50%);font-size:9px;color:var(--faint);font-variant-numeric:tabular-nums}
  .ticks span.hit{color:var(--accent)}
</style>
</head>
<body>
  <h1>Analytics</h1>
  <div class="sub" id="sub">—</div>

  <div class="kpis" id="kpis"></div>

  <div class="card">
    <h2>TOPIC GOALS — HOURS TOWARD 10 · 24 · 50 · 100</h2>
    <div id="goals"></div>
  </div>

  <div class="card">
    <h2>DAILY UTILISATION — LAST 30 DAYS</h2>
    <div id="trend"></div>
  </div>

  <div class="row2">
    <div class="card">
      <h2>HOUR-OF-DAY PATTERN — WHEN YOU'RE MOST ACCOUNTABLE</h2>
      <div id="hours"></div>
    </div>
    <div class="card">
      <h2>CONSISTENCY — LAST 5 WEEKS</h2>
      <div id="heat"></div>
      <div class="legend">less
        <span class="cell" style="background:rgba(94,234,212,0.12)"></span>
        <span class="cell" style="background:rgba(94,234,212,0.38)"></span>
        <span class="cell" style="background:rgba(94,234,212,0.66)"></span>
        <span class="cell" style="background:rgba(94,234,212,1)"></span>
        more
      </div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
