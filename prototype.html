<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeGrid — prototype</title>
<style>
  :root{
    --bg: rgba(22,23,28,0.82);
    --line:rgba(255,255,255,0.07);
    --text:#e7e8ec;
    --muted:#8b8d98;
    --faint:#4a4c57;
    --accent:#5eead4;
    --accent-dim:rgba(94,234,212,0.16);
    --radius:14px;
    --font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--font);
    background:
      radial-gradient(1200px 800px at 20% 10%, #2a3f52, transparent),
      radial-gradient(1000px 700px at 90% 90%, #3a2b4a, transparent),
      #10131a;
    min-height:100vh;color:var(--text);-webkit-font-smoothing:antialiased;
    display:flex;align-items:flex-start;justify-content:center;padding:40px;gap:40px;
  }
  .hint{position:fixed;top:16px;left:16px;color:var(--muted);font-size:12px;max-width:240px;line-height:1.55}
  .hint b{color:var(--text)}

  .panel{
    width:300px;background:var(--bg);
    backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);
    border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 20px 60px rgba(0,0,0,0.45);overflow:hidden;
  }

  /* ---- title bar ---- */
  .bar{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line);user-select:none}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);flex:0 0 auto}
  .nav{display:flex;align-items:center;gap:2px;flex:1;min-width:0}
  .nav .date{font-size:13px;font-weight:600;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav .today-tag{font-size:9px;color:var(--accent);border:1px solid var(--accent-dim);border-radius:4px;padding:1px 4px;margin-left:2px}
  .spacer{flex:1}
  .count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;padding:3px 8px;border:1px solid var(--line);border-radius:20px;white-space:nowrap}
  .count b{color:var(--accent)}
  .icon-btn{width:24px;height:24px;border:none;background:transparent;color:var(--muted);border-radius:6px;cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .icon-btn:hover{background:rgba(255,255,255,0.08);color:var(--text)}
  .icon-btn:disabled{opacity:.25;cursor:default}
  .icon-btn:disabled:hover{background:transparent;color:var(--muted)}

  .meter{height:2px;background:rgba(255,255,255,0.06)}
  .meter > i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

  /* ---- hour rows (24 view) ---- */
  .grid{max-height:64vh;overflow-y:auto;padding:6px 0}
  .grid::-webkit-scrollbar{width:6px}
  .grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}

  .hour{display:flex;align-items:center;gap:10px;padding:3px 14px;border-left:2px solid transparent}
  .hour.now{border-left-color:var(--accent);background:linear-gradient(90deg,var(--accent-dim),transparent)}
  .hour .hr{font-size:12px;color:var(--muted);width:30px;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .hour.now .hr{color:var(--accent);font-weight:600}
  .hour.past .hr{color:var(--faint)}
  .cells{display:flex;gap:5px;flex:1}
  /* each half-hour cell */
  .cell{
    flex:1;height:22px;border-radius:6px;cursor:pointer;position:relative;
    border:1.5px solid var(--faint);background:rgba(255,255,255,0.03);
    transition:all .13s;display:flex;align-items:center;justify-content:center;
  }
  .cell::before{content:attr(data-m);font-size:9px;color:var(--faint)}
  .cell:hover{border-color:var(--muted);background:rgba(255,255,255,0.07)}
  .cell.past:not(.done){opacity:.45}
  .cell.done{background:var(--accent);border-color:var(--accent)}
  .cell.done::before{content:"";width:4px;height:8px;border:solid #0f1114;border-width:0 2px 2px 0;transform:rotate(45deg);margin-bottom:2px}
  .cell.nowcell{border-color:var(--accent);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--accent-dim)}50%{box-shadow:0 0 0 4px transparent}}

  /* ---- collapse summary rows ---- */
  .fold{
    display:flex;align-items:center;gap:8px;margin:2px 14px;padding:6px 10px;
    font-size:11px;color:var(--muted);cursor:pointer;border-radius:8px;
    background:rgba(255,255,255,0.03);border:1px dashed var(--line);user-select:none;
  }
  .fold:hover{background:rgba(255,255,255,0.06);color:var(--text)}
  .fold .chev{transition:transform .15s}
  .fold b{color:var(--accent);font-variant-numeric:tabular-nums}
  .fold .mini{flex:1;display:flex;gap:2px;justify-content:flex-end;align-items:center;height:12px}
  .fold .mini > i{width:3px;border-radius:1px;background:var(--faint);height:100%}
  .fold .mini > i.on{background:var(--accent)}

  /* ---- toolbar ---- */
  .tools{display:flex;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
  .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .seg button{border:none;background:transparent;color:var(--muted);font-size:11px;padding:4px 9px;cursor:pointer}
  .seg button.on{background:var(--accent-dim);color:var(--accent)}

  /* ---- minimized pill ---- */
  .panel.min .grid,.panel.min .meter,.panel.min .tools{display:none}
  .panel.min{width:auto}
  .panel.min .bar{border-bottom:none}
  .panel.min .nav .prev,.panel.min .nav .next{display:none}
</style>
</head>
<body>
  <div class="hint">
    <b>TimeGrid</b> — 24-row view. Each hour = two half-hour cells (<b>:00</b> · <b>:30</b>). Click a cell to mark it utilised.
    <br><br>Use <b>‹ ›</b> to browse past days. Toggle <b>Collapse</b> to fold away past &amp; future hours around <b>now</b>.
  </div>

  <div class="panel" id="panel">
    <div class="bar">
      <span class="dot"></span>
      <div class="nav">
        <button class="icon-btn prev" id="prev" title="Previous day">‹</button>
        <span class="date" id="date">—</span>
        <span class="today-tag" id="todayTag">today</span>
        <button class="icon-btn next" id="next" title="Next day">›</button>
      </div>
      <span class="count"><b id="c-done">0</b>/48</span>
      <button class="icon-btn" id="min" title="Minimize">–</button>
    </div>
    <div class="meter"><i id="meter"></i></div>
    <div class="grid" id="grid"></div>
    <div class="tools">
      <div class="seg" id="collapseSeg">
        <button data-v="0" class="on">Full day</button>
        <button data-v="1">Collapse</button>
      </div>
      <span class="spacer"></span>
      <span id="pct">0%</span>
    </div>
  </div>

<script>
  const TOTAL = 48;
  const realNow = new Date();
  const nowSlot = realNow.getHours()*2 + (realNow.getMinutes()>=30?1:0);

  let viewDate = new Date(realNow); viewDate.setHours(0,0,0,0);
  const todayStart = new Date(realNow); todayStart.setHours(0,0,0,0);
  let collapse = false;
  const foldState = {past:false, future:false}; // false = collapsed

  const keyOf = d => 'timegrid:'+d.toISOString().slice(0,10);
  let doneSet = new Set();
  function load(){ doneSet = new Set(JSON.parse(localStorage.getItem(keyOf(viewDate))||'[]')); }
  function save(){ localStorage.setItem(keyOf(viewDate), JSON.stringify([...doneSet])); }

  const isToday = () => viewDate.getTime()===todayStart.getTime();
  const isPastDay = () => viewDate.getTime()<todayStart.getTime();

  const grid = document.getElementById('grid');

  function hourRow(h){
    // returns a fully built hour row element
    const a = h*2, b = h*2+1;
    const cur = isToday();
    const row = document.createElement('div');
    let cls = 'hour';
    if(cur && (a===nowSlot||b===nowSlot)) cls+=' now';
    else if((cur && a<nowSlot) || isPastDay()) cls+=' past';
    row.className = cls;
    row.innerHTML = `<span class="hr">${String(h).padStart(2,'0')}</span><div class="cells"></div>`;
    const cells = row.querySelector('.cells');
    [a,b].forEach(i=>{
      const c = document.createElement('div');
      let cc='cell';
      if(doneSet.has(i)) cc+=' done';
      if(cur){ if(i<nowSlot) cc+=' past'; if(i===nowSlot) cc+=' nowcell'; }
      else if(isPastDay()) cc+=' past';
      c.className=cc;
      c.dataset.m = i%2? ':30':':00';
      c.onclick=()=>{ doneSet.has(i)?doneSet.delete(i):doneSet.add(i); save(); render(); };
      cells.appendChild(c);
    });
    return row;
  }

  function foldRow(label, hoursArr, key){
    const doneCount = hoursArr.reduce((n,h)=> n + (doneSet.has(h*2)?1:0) + (doneSet.has(h*2+1)?1:0), 0);
    const total = hoursArr.length*2;
    const el=document.createElement('div');
    el.className='fold';
    // tiny dot strip preview
    let mini='';
    hoursArr.forEach(h=>{ [h*2,h*2+1].forEach(i=> mini+=`<i class="${doneSet.has(i)?'on':''}"></i>`); });
    el.innerHTML=`<span class="chev">▸</span><span>${label}</span> · <b>${doneCount}/${total}</b>
      <div class="mini">${mini}</div>`;
    el.onclick=()=>{ foldState[key]=!foldState[key]; render(); };
    return el;
  }

  function render(){
    grid.innerHTML='';
    const cur = isToday();
    const nowHour = Math.floor(nowSlot/2);

    if(collapse && cur){
      // group: past hours (< nowHour), the now window (nowHour..nowHour+? show a few), future
      const pastHours=[], futureHours=[];
      for(let h=0;h<24;h++){ if(h<nowHour) pastHours.push(h); else if(h>nowHour+2) futureHours.push(h); }
      if(pastHours.length){
        if(foldState.past){
          grid.appendChild(foldRow('▾ Earlier today', pastHours,'past'));
          pastHours.forEach(h=>grid.appendChild(hourRow(h)));
        } else grid.appendChild(foldRow('Earlier today', pastHours,'past'));
      }
      for(let h=nowHour; h<=Math.min(23,nowHour+2); h++) grid.appendChild(hourRow(h));
      if(futureHours.length){
        if(foldState.future){
          grid.appendChild(foldRow('▾ Later today', futureHours,'future'));
          futureHours.forEach(h=>grid.appendChild(hourRow(h)));
        } else grid.appendChild(foldRow('Later today', futureHours,'future'));
      }
    } else {
      for(let h=0;h<24;h++) grid.appendChild(hourRow(h));
    }

    // stats + header
    document.getElementById('c-done').textContent=doneSet.size;
    document.getElementById('meter').style.width=(doneSet.size/TOTAL*100)+'%';
    document.getElementById('pct').textContent=Math.round(doneSet.size/TOTAL*100)+'%';
    document.getElementById('date').textContent=
      viewDate.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
    document.getElementById('todayTag').style.display=isToday()?'':'none';
    document.getElementById('next').disabled=isToday();

    if(cur && !render.scrolled){
      const nEl=grid.querySelector('.now'); if(nEl){nEl.scrollIntoView({block:'center'});render.scrolled=true;}
    }
  }

  // navigation
  document.getElementById('prev').onclick=()=>{ viewDate.setDate(viewDate.getDate()-1); load(); render.scrolled=false; render(); };
  document.getElementById('next').onclick=()=>{ if(isToday())return; viewDate.setDate(viewDate.getDate()+1); load(); render(); };

  // collapse toggle
  document.querySelectorAll('#collapseSeg button').forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll('#collapseSeg button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); collapse=b.dataset.v==='1'; render();
    };
  });

  // minimize
  const panel=document.getElementById('panel');
  document.getElementById('min').onclick=()=>{
    panel.classList.toggle('min');
    document.getElementById('min').textContent=panel.classList.contains('min')?'▢':'–';
  };

  load(); render();
</script>
</body>
</html>
