<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeGrid — prototype</title>
<style>
  :root{
    --bg: rgba(22,23,28,0.96);
    --line:rgba(255,255,255,0.07);
    --text:#e7e8ec;
    --muted:#8b8d98;
    --faint:#4a4c57;
    --accent:#5eead4;
    --accent-dim:rgba(94,234,212,0.16);
    --ok:#5eead4;
    --no:#f0708a;
    --radius:14px;
    --font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--font);
    background:
      radial-gradient(1200px 800px at 20% 10%, #2a3f52, transparent),
      radial-gradient(1000px 700px at 90% 90%, #3a2b4a, transparent),
      #10131a;
    min-height:100vh;color:var(--text);-webkit-font-smoothing:antialiased;
    display:flex;align-items:flex-start;justify-content:center;padding:40px;gap:40px;
  }
  .hint{position:fixed;top:16px;left:16px;color:var(--muted);font-size:12px;max-width:240px;line-height:1.55}
  .hint b{color:var(--text)}

  .panel{
    width:320px;background:var(--bg);
    backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);
    border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 20px 60px rgba(0,0,0,0.45);overflow:hidden;
  }

  .bar{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line);user-select:none}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);flex:0 0 auto}
  .date{font-size:13px;font-weight:600;letter-spacing:.2px}
  .spacer{flex:1}
  .count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;padding:3px 8px;border:1px solid var(--line);border-radius:20px}
  .count b{color:var(--accent)}

  .meter{height:2px;background:rgba(255,255,255,0.06)}
  .meter > i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

  /* ---------- learning box ---------- */
  .learnbox{padding:9px 12px;border-bottom:1px solid var(--line)}
  .learnbox .cap{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .learnbox .cap .lbl{font-size:11px;color:var(--muted);letter-spacing:.3px}
  .learnbox .cap .slot{font-size:11px;color:var(--accent);font-variant-numeric:tabular-nums;font-weight:600}
  .learnbox .cap .slot.none{color:var(--faint);font-weight:400}
  .learnrow{display:flex;align-items:center;gap:6px}
  .learnrow input{
    flex:1;min-width:0;background:rgba(255,255,255,0.05);border:1px solid var(--line);
    border-radius:8px;color:var(--text);font-family:var(--font);font-size:13px;padding:7px 10px;outline:none;
    transition:border-color .15s;
  }
  .learnrow input:disabled{opacity:.5}
  .learnrow input::placeholder{color:var(--faint)}
  .learnrow input:focus{background:rgba(255,255,255,0.08)}
  .act{
    width:30px;height:30px;flex:0 0 auto;border:1px solid var(--line);border-radius:8px;
    background:transparent;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    opacity:0;transform:scale(.85);pointer-events:none;transition:all .14s;
  }
  .act.show{opacity:1;transform:scale(1);pointer-events:auto}
  .act.no:hover{border-color:var(--no);color:var(--no);background:rgba(240,112,138,0.12)}
  .act.ok:hover{border-color:var(--ok);color:var(--ok);background:var(--accent-dim)}

  /* ---------- slots ---------- */
  .grid{max-height:56vh;overflow-y:auto;padding:6px 0}
  .grid::-webkit-scrollbar{width:6px}
  .grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}
  .hour{display:flex;align-items:center;gap:10px;padding:3px 14px;border-left:2px solid transparent}
  .hour.now{border-left-color:var(--accent);background:linear-gradient(90deg,var(--accent-dim),transparent)}
  .hour .hr{font-size:12px;color:var(--muted);width:30px;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .hour.now .hr{color:var(--accent);font-weight:600}
  .hour.past .hr{color:var(--faint)}
  .cells{display:flex;gap:5px;flex:1}
  .cell{
    flex:1;height:22px;border-radius:6px;cursor:pointer;position:relative;
    border:1.5px solid var(--faint);background:rgba(255,255,255,0.03);
    transition:all .13s;display:flex;align-items:center;justify-content:center;
  }
  .cell::before{content:attr(data-m);font-size:9px;color:var(--faint)}
  .cell:hover{border-color:var(--muted);background:rgba(255,255,255,0.07)}
  .cell.past:not(.done){opacity:.45}
  .cell.done{background:var(--accent);border-color:var(--accent)}
  .cell.done::before{content:"";width:4px;height:8px;border:solid #0f1114;border-width:0 2px 2px 0;transform:rotate(45deg);margin-bottom:2px}
  /* a done cell that also carries a topic gets a subtle inner dot */
  .cell.tagged::after{content:"";position:absolute;top:2px;right:2px;width:4px;height:4px;border-radius:50%;background:#0f1114;opacity:.55}
  .cell.nowcell{border-color:var(--accent);animation:pulse 2s infinite}
  .cell.sel{outline:2px solid #fff;outline-offset:1px}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--accent-dim)}50%{box-shadow:0 0 0 4px transparent}}
</style>
</head>
<body>
  <div class="hint">
    <b>TimeGrid</b> — click a cell to select it. Its learning note loads into the box (empty if none).
    <br><br>Type to edit — <b>✗</b> cancels, <b>✓</b> confirms the change for that cell. Click a selected done cell again to clear it.
  </div>

  <div class="panel">
    <div class="bar">
      <span class="dot"></span>
      <span class="date" id="date">—</span>
      <span class="spacer"></span>
      <span class="count"><b id="c-done">0</b>/48</span>
    </div>
    <div class="meter"><i id="meter"></i></div>

    <div class="learnbox">
      <div class="cap">
        <span class="lbl">Learning</span>
        <span class="slot none" id="selLabel">— select a cell —</span>
      </div>
      <div class="learnrow">
        <input id="learn" list="topics" placeholder="Please enter a Topic" autocomplete="off" spellcheck="false" disabled>
        <datalist id="topics"></datalist>
        <button class="act no" id="cancel" title="Cancel change">✗</button>
        <button class="act ok" id="confirm" title="Confirm change">✓</button>
      </div>
    </div>

    <div class="grid" id="grid"></div>
  </div>

<script>
  const TOTAL = 48;
  const pad = n => String(n).padStart(2,'0');
  const now = new Date();
  const nowSlot = now.getHours()*2 + (now.getMinutes()>=30?1:0);
  const STORE = 'timegrid:proto:'+now.toISOString().slice(0,10);

  // data: { slotIndex: "topic" }  (presence = utilised; "" = done, no details)
  let data = JSON.parse(localStorage.getItem(STORE) || '{}');
  let selected = null;

  const grid = document.getElementById('grid');
  const input = document.getElementById('learn');
  const btnOk = document.getElementById('confirm');
  const btnNo = document.getElementById('cancel');
  const selLabel = document.getElementById('selLabel');

  const isDone = i => Object.prototype.hasOwnProperty.call(data, i);
  const savedTopic = i => (isDone(i) ? data[i] : '');
  const slotTime = i => `${pad(Math.floor(i/2))}:${i%2?'30':'00'}`;

  function topicColor(t){
    if(!t) return null;
    let h=0; for(let i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))%360;
    return `hsl(${h} 62% 58%)`;
  }

  function save(){ localStorage.setItem(STORE, JSON.stringify(data)); refreshTopics(); }

  function render(){
    grid.innerHTML='';
    for(let h=0;h<24;h++){
      const row=document.createElement('div');
      let cls='hour';
      if(h*2===nowSlot||h*2+1===nowSlot) cls+=' now'; else if(h*2<nowSlot) cls+=' past';
      row.className=cls;
      row.innerHTML=`<span class="hr">${pad(h)}</span><div class="cells"></div>`;
      const cells=row.querySelector('.cells');
      [h*2,h*2+1].forEach(i=>{
        const c=document.createElement('div');
        let cc='cell';
        if(isDone(i)) cc+=' done';
        if(isDone(i) && data[i]) cc+=' tagged';
        if(i<nowSlot) cc+=' past';
        if(i===nowSlot) cc+=' nowcell';
        if(i===selected) cc+=' sel';
        c.className=cc;
        c.dataset.m = i%2 ? ':30':':00';
        if(isDone(i)){
          const col=topicColor(data[i]);
          if(col){ c.style.background=col; c.style.borderColor=col; }
          c.title = slotTime(i) + (data[i] ? ' · '+data[i] : '');
        }
        c.onclick=()=>selectCell(i);
        cells.appendChild(c);
      });
      grid.appendChild(row);
    }
    const n=Object.keys(data).length;
    document.getElementById('c-done').textContent=n;
    document.getElementById('meter').style.width=(n/TOTAL*100)+'%';
  }

  function selectCell(i){
    // clicking an already-selected done cell clears it
    if(selected===i && isDone(i)){
      delete data[i]; save();
      selected=null; loadBox(); render(); return;
    }
    // clicking a not-yet-done cell marks it done (empty details) and selects it
    if(!isDone(i)){ data[i]=''; save(); }
    selected=i; loadBox(); render(); input.focus();
  }

  function loadBox(){
    if(selected===null){
      input.value=''; input.disabled=true; input.placeholder='Please enter a Topic';
      selLabel.textContent='— select a cell —'; selLabel.classList.add('none');
    } else {
      input.disabled=false;
      input.value=savedTopic(selected);
      input.placeholder='Please enter a Topic';
      selLabel.textContent=slotTime(selected); selLabel.classList.remove('none');
    }
    updateButtons();
  }

  function updateButtons(){
    const changed = selected!==null && input.value.trim() !== savedTopic(selected);
    btnOk.classList.toggle('show', changed);
    btnNo.classList.toggle('show', changed);
    input.style.borderColor = changed ? 'var(--accent)' : 'var(--line)';
  }

  input.addEventListener('input', updateButtons);
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter') confirmChange();
    if(e.key==='Escape') cancelChange();
  });
  btnOk.onclick = confirmChange;
  btnNo.onclick = cancelChange;

  function confirmChange(){
    if(selected===null) return;
    data[selected]=input.value.trim(); save();
    updateButtons(); render();
  }
  function cancelChange(){
    if(selected===null) return;
    input.value=savedTopic(selected); updateButtons();
  }

  function refreshTopics(){
    const set=new Set(Object.values(data).filter(Boolean));
    document.getElementById('topics').innerHTML=[...set].sort().map(t=>`<option value="${t}"></option>`).join('');
  }

  document.getElementById('date').textContent=now.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  refreshTopics(); render(); loadBox();
</script>
</body>
</html>
