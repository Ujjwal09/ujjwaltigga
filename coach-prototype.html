<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeGrid — Coach preview</title>
<style>
  :root{
    --bg:#14151a;--card:#1c1e25;--line:rgba(255,255,255,0.07);
    --text:#e7e8ec;--muted:#8b8d98;--faint:#4a4c57;--accent:#5eead4;--accent-dim:rgba(94,234,212,0.16);
    --no:#f0708a;
    --font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;padding:28px 32px;max-width:760px;margin:0 auto}
  h1{font-size:18px;font-weight:600;letter-spacing:.3px;margin-bottom:2px}
  .sub{color:var(--muted);font-size:12px;margin-bottom:20px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:18px}
  .cap{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .cap h2{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.3px}
  .cap .spacer{flex:1}
  .btn{border:1px solid var(--accent);background:var(--accent-dim);color:var(--accent);border-radius:8px;
    padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font)}
  .btn:disabled{opacity:.5;cursor:default}
  .ghost{border-color:var(--line);background:transparent;color:var(--muted)}
  .ghost:hover{color:var(--text);border-color:var(--muted)}

  /* coach output */
  .coach .headline{font-size:16px;font-weight:600;margin-bottom:6px}
  .coach .stats{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:16px;
    padding-bottom:14px;border-bottom:1px solid var(--line)}
  .coach .stats b{color:var(--accent)}
  .coach h3{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:14px 0 6px}
  .coach p{font-size:13.5px;line-height:1.6;color:var(--text)}
  .coach .actions{margin:8px 0 0;padding-left:0;list-style:none}
  .coach .actions li{font-size:13.5px;line-height:1.55;margin-bottom:8px;padding-left:22px;position:relative}
  .coach .actions li::before{content:"→";position:absolute;left:0;color:var(--accent);font-weight:700}
  .coach .actions li b{font-weight:600}
  .coach .bottom{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.6}

  .meta{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:11px;color:var(--faint)}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--faint)}

  /* loading */
  .loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;padding:12px 0}
  .spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:18px}
  .toolbar .lbl{font-size:11px;color:var(--muted)}
  .note{font-size:11px;color:var(--faint);margin-top:4px}
</style>
</head>
<body>
  <h1>Coach <span style="color:var(--faint);font-weight:400;font-size:13px">(browser preview)</span></h1>
  <div class="sub">Static sample outputs to settle tone &amp; layout. The real card is generated by Claude from your tracked data.</div>

  <div class="toolbar">
    <span class="lbl">Preview tone:</span>
    <button class="btn ghost" data-tone="warm">Warm</button>
    <button class="btn ghost" data-tone="blunt">Blunt</button>
    <button class="btn ghost" data-tone="quiet">Quiet week</button>
  </div>

  <div class="card">
    <div class="cap">
      <h2>YOUR COACH</h2>
      <span class="spacer"></span>
      <button class="btn" id="gen">✨ Generate summary</button>
    </div>
    <div id="out"></div>
  </div>

<script>
  const SAMPLES = {
    warm: {
      headline: "🔥 You're building real momentum",
      stats: `This week: <b>27.5h</b> logged · <b>4/7</b> days hit your 8h target · <b>6-day</b> streak`,
      sections: [
        ["The story your data tells", "DSA is your anchor — 38 hours and climbing steadily past the 24h mark toward 50. That consistency is the single biggest predictor of follow-through, and you have it. System Design is the quiet winner: it jumped from 6h to 15h in two weeks, your steepest climb of any topic."],
        ["Where the curve is flattening", "ML has stalled at ~9h — three weeks in the 10h band with no break above it. It's not a motivation problem; it's a scheduling one. Your ML sessions only ever land in late-evening slots, which are also your most-skipped slots."],
      ],
      actions: [
        "<b>Move one ML block to a morning slot.</b> Your morning cells have your highest completion rate — put your hardest topic where your discipline is strongest.",
        "<b>Close “Review pointers deep-dive.”</b> It's been open 11 days — your oldest task. A 30-minute slot tomorrow clears it.",
      ],
      bottom: "You're ~12 hours from your first 50-hour topic. At your current DSA pace, that's about two weeks away. Keep the streak alive. 💪",
    },
    blunt: {
      headline: "Solid week, but ML is drifting",
      stats: `This week: <b>27.5h</b> · target hit <b>4/7</b> · streak <b>6d</b>`,
      sections: [
        ["What's working", "DSA carries you: 38h and past 24h. Fine. Don't coast on it to avoid the harder topics."],
        ["What's not", "ML: 9h in three weeks, flat. You keep scheduling it at night and then skipping it. That's a decision, not bad luck. Two aging tasks are also sitting untouched (11 and 8 days)."],
      ],
      actions: [
        "<b>Put ML in a morning slot this week</b> — at least 3 blocks. Prove the stall is scheduling, not interest.",
        "<b>Clear both stale tasks in the next 48h</b> or delete them. Open loops you won't close are just noise.",
      ],
      bottom: "You have the consistency. Point it at the topic you're avoiding, not the one you enjoy.",
    },
    quiet: {
      headline: "Quiet week — that's data too",
      stats: `This week: <b>6h</b> logged · target hit <b>0/7</b> · streak <b>reset</b>`,
      sections: [
        ["No judgment, just the picture", "Hours dropped from a 26h average to 6h, and the streak reset. Life happens — one light week doesn't undo 62 hours of history. Your goals don't expire."],
        ["The one thing that matters now", "Re-starting is harder than continuing, so make the restart tiny. Not 8 hours — one slot. Momentum, not heroics."],
      ],
      actions: [
        "<b>Book a single 30-minute DSA slot tomorrow morning.</b> That's the whole goal. One green cell restarts the streak.",
      ],
      bottom: "You were 12 hours from a 50-hour topic last week — that's still true this week. Nothing was lost. Start small. 🌱",
    },
  };

  let tone = 'warm';
  const out = document.getElementById('out');

  function render(sample){
    out.innerHTML = `<div class="coach">
      <div class="headline">${sample.headline}</div>
      <div class="stats">${sample.stats}</div>
      ${sample.sections.map(([h,p])=>`<h3>${h}</h3><p>${p}</p>`).join('')}
      <h3>Try this</h3>
      <ul class="actions">${sample.actions.map(a=>`<li>${a}</li>`).join('')}</ul>
      <div class="bottom">${sample.bottom}</div>
      <div class="meta"><span>Generated by claude-opus-5</span><span class="dot"></span><span>from 12 days of your data</span><span class="dot"></span><span>just now</span></div>
    </div>`;
  }

  function generate(){
    const btn = document.getElementById('gen');
    btn.disabled = true;
    out.innerHTML = `<div class="loading"><span class="spin"></span> Reading your last 12 days…</div>`;
    setTimeout(()=>{ render(SAMPLES[tone]); btn.disabled = false; }, 900);
  }

  document.getElementById('gen').onclick = generate;
  document.querySelectorAll('[data-tone]').forEach(b=>{
    b.onclick = ()=>{ tone = b.dataset.tone; render(SAMPLES[tone]); };
  });

  render(SAMPLES.warm);
</script>
</body>
</html>
